# Pull-request check with a paychaos dashboard. Each run is compared with the
# latest run on the base branch, so a pull request fails only on payment-safety
# problems it introduces, and one comment on the pull request shows the verdict
# (updated on every push, never duplicated).
#
# Setup, once:
#   1. In the dashboard, create a project, an ingest token and (optionally) a
#      scenario, e.g. "checkout-strict".
#   2. Repository secret PAYCHAOS_TOKEN = the ingest token;
#      repository variable PAYCHAOS_API = the dashboard URL.
#   3. Your tests read the PayPal API base URL from PAYCHAOS_PROXY_URL (paychaos
#      sets it for the command after --), or point them at http://127.0.0.1:8080.
#
# The push to main keeps the baseline fresh; problem status in the dashboard
# moves only with runs on the default branch.
name: paychaos

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # only for the verdict comment; uses the job's own token

jobs:
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install github.com/shangai2405/paychaos/cmd/paychaos@latest

      - name: payment-safety check
        env:
          PAYCHAOS_TOKEN: ${{ secrets.PAYCHAOS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          paychaos ci -upstream mock -scenario checkout-strict -seed 7 \
            -report-to "${{ vars.PAYCHAOS_API }}" \
            -junit paychaos-junit.xml \
            -- make integration-test
        # Exit 2 when the pull request adds a HIGH problem (-fail-on new-high,
        # the default with `ci`). Use -fail-on new-any to be stricter, or
        # -fail-on high to fail on every HIGH finding regardless of the base.
